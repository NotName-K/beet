[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beet"
version = "0.1.0"
description = "Modelo de predicción y detección de apuestas deportivas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 🚀 NUEVO: SDK oficial de Google para Gemini (soporta multi-hilo y visión)
    "google-genai>=0.1.0",
    
    # UI y utilidades base
    "PyQt6>=6.5.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    
    # ❌ ELIMINADOS: opencv-python, pillow, pytesseract, pdfplumber
    # Ya no son necesarios porque Gemini lee las imágenes y PDFs nativamente.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
beet-visor = "beet.ui.main:main"

[tool.pytest.ini_options]
testpaths = ["beet/tests"]
python_files = "test_*.py"