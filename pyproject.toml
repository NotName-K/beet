[project]
name = "beet"
version = "0.1.0"
description = "Modelo de predicción y detección de apuestas deportivas"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NotName-K"}
]
dependencies = [
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pdfplumber>=0.10.0",
    "numpy>=1.24.0",
    "PyQt6>=6.5.0",  # <-- NUEVO: para el visor
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
beet-visor = "beet.ui.__main__:main"  # <-- NUEVO: comando CLI

[tool.pytest.ini_options]
testpaths = ["beet/tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]