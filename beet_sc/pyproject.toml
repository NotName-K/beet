[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beet"
version = "0.1.0"
description = "Modelo de predicción y detección de apuestas deportivas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"